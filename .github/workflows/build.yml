# ESP On Demand — CI: the service parses and its player page is well-formed
name: build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: syntax + smoke
        run: |
          python3 -m py_compile eod_serve.py
          python3 eod_serve.py --help
      - name: repo hygiene
        run: |
          test -f README.md
          test -f LICENSE
          grep -q "ESPlab-WebUI" README.md   # must reference its dependency
